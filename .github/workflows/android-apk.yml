
name: Asset Forge Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch UnityPy Git LFS resources
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          git -C third_party/UnityPy lfs pull

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "third_party/UnityPy/UnityPy/resources/lzma.tpk"
          )
          data = path.read_bytes()

          print(f"TPK size: {len(data)} bytes")
          print(f"TPK header: {data[:16].hex(' ')}")

          if data[:4] != b"TPK*":
              raise SystemExit(
                  "ERROR: UnityPy lzma.tpk is not the real TPK binary"
              )

          print("OK: UnityPy TPK resource is valid")
          PY

      - name: Apply temporary UnityPy TPK diagnostic patch
        run: |
          git -C third_party/UnityPy apply "$GITHUB_WORKSPACE/unitypy-tpk-diagnostic.patch"
          git -C third_party/UnityPy diff --check
          git -C third_party/UnityPy diff -- UnityPy/helpers/Tpk.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Verify toolchain
        run: |
          java -version
          python3.10 --version
          git submodule status
          sdkmanager --list_installed

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-forge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
